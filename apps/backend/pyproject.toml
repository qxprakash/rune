[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.4",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "psutil>=6.1.0",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "redis>=6.4.0",
    "rq>=2.5.0",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "ruff>=0.12.10",
]

# Optional backend dependencies
pytorch = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "tokenizers>=0.13.0",
    "safetensors>=0.3.0",
]

[tool.ruff]
# Apply Ruff to this backend app.
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.format]
# Enable Ruff's built-in formatter.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
# Keep linting sane and fast; expand as the codebase grows.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize code)
]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
